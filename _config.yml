# Site settings
title: Felipe Gonzalez
email: fegonzalez17@gmail.com
description: >-
  AI & Software Development Specialist with 3+ years building GenAI solutions.
  Expertise in RAG systems, FastAPI microservices, Python development.
  University lecturer in Python and Robotics at Universidad Nacional de Colombia.
baseurl: ""
url: "https://felipeg17.github.io"
permalink: /blog/:year/:month/:title/

# Author info
author:
  name: Felipe Gonzalez Roldan
  email: fegonzalezro@unal.edu.co
  email_personal: fegonzalez17@gmail.com
  github: felipeg17
  github_academic: fegonzalez7
  linkedin: felipegonzalezroldan
  youtube: felipeg17
  location: Bogotá, Colombia

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Exclude from processing
exclude:
  - .claude/
  - .github/
  - .vscode/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Felipe Gonzalez"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Google Analytics
google_analytics: UA-16344709-2

# SEO settings
social:
  name: Felipe Gonzalez Roldan
  links:
    - https://github.com/felipeg17
    - https://github.com/fegonzalez7
    - https://www.linkedin.com/in/felipegonzalezroldan/
    - https://www.youtube.com/@felipeg17
